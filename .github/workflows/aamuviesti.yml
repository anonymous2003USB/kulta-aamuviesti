name: Aamuviesti

on:
  schedule:
    # Ma–pe klo 05.15 UTC = 8.15 Suomen kesäaikaa, 7.15 talviaikaa.
    # GitHub voi myöhästyä ajastetuista ajoista ruuhka-aikoina jonkin verran.
    - cron: "15 5 * * 1-5"
  workflow_dispatch:   # "Run workflow" -nappi käsin käynnistämiseen

jobs:
  viesti:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python aamuviesti.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TILI: ${{ vars.TILI }}
          RISKI: ${{ vars.RISKI }}
          RAJAT: ${{ vars.RAJAT }}
