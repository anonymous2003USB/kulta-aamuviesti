name: Aamuviesti

on:
  # Pääkäynnistys: cron-job.org kutsuu tätä ma–pe klo 8.10 Suomen aikaa ("Run workflow" -nappi toimii myös käsin).
  workflow_dispatch:
  # Varmuusajo: GitHubin oma ajastus myöhästyy usein tunteja. Jos aamun viesti on jo lähetetty, ajo ohitetaan.
  schedule:
    - cron: "15 5 * * 1-5"

permissions:
  contents: write   # ennuste.json tallennetaan kansioon Clauden luettavaksi
  actions: write    # käynnistää päivän hintasyötteen (hinnat.yml)

jobs:
  viesti:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python aamuviesti.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TILI: ${{ vars.TILI }}
          RISKI: ${{ vars.RISKI }}
          RAJAT: ${{ vars.RAJAT }}
      - name: Tallenna ennuste.json
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- ennuste.json)" ]; then
            echo "Ei uutta ennustetta tallennettavaksi."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ennuste.json
          git commit -m "Ennuste $(date -u +%F)"
          git push
      - name: Käynnistä päivän hintasyöte
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hinnat.yml --ref main -R "$GITHUB_REPOSITORY" -f kertaa=0
